<header class="bn-header">
  <div class="bn-header-inner">
    <div class="bn-header-left">
      <button type="button" class="bn-menu-btn" id="bnMenuBtn" aria-label="সূচিপত্র খুলুন" aria-expanded="false" aria-controls="bnSidebar">
        <svg class="bn-menu-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <a href="{{ '/bn/' | relative_url }}" class="bn-brand-link">
        <span class="bn-brand-mark">*</span>
        <div class="bn-brand-text">
          <div class="bn-brand-title">
            <span>Select Star SQL</span>
            <span class="bn-brand-badge">বাংলা</span>
          </div>
          <span class="bn-brand-subtitle">An Interactive SQL Book • Technical Terms in English</span>
        </div>
      </a>
    </div>

    <div class="bn-header-right">
      <button type="button" class="bn-header-btn bn-sandbox-btn" id="bnSandboxBtn" aria-label="মুক্ত এসকিউএল স্যান্ডবক্স খুলুন" title="মুক্ত এসকিউএল স্যান্ডবক্স (SQL Sandbox)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
        <span class="bn-header-btn-text">স্যান্ডবক্স</span>
      </button>

      <button type="button" class="bn-header-btn bn-schema-btn" id="bnSchemaBtn" aria-label="ডাটাবেস স্কিমা ও শব্দকোষ খুলুন" title="ডাটাবেস স্কিমা ও শব্দকোষ (Schema & Glossary)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
        </svg>
        <span class="bn-header-btn-text">স্কিমা ও শব্দকোষ</span>
      </button>

      <button type="button" class="bn-header-btn bn-theme-toggle" id="bnThemeToggle" aria-label="ডার্ক মোড চালু করুন" title="ডার্ক মোড চালু করুন" aria-live="polite">
        <svg class="bn-theme-icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="bn-theme-icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>

      {% include language_switcher.html lang="bn" %}
    </div>
  </div>
</header>
